name: Verify pipeline orchestration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: git fetch --no-tags origin 4b06935b23edee3045a58553ec9fcdf2fa056084 644065dd561019b351ca7330d2146fd4c10e1d66 9f13ea79977dda1b56f25df5ca5c4060ffaf345f c54503f00e65ad4195a74c0bacf2ce003add091c 36fd314015812f2114d5e96a0cbbaee24b17b2e4 62e48215a3609ba136f4ce581f98cc893e2378d9 6da3603a8e447dacfdbde25a8aab5c5fa3721328 01a3fea6a104ab0a99d06bbeba7cd766266f240a
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: git fetch --no-tags origin e20b9fef9ad03ab061857d2d4f7098fa20fbf25e
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/publication.py
      - run: python scripts/verify.py --output work/ci-evidence
      - run: python scripts/capture.py --workspace work/ci-browser --output work/ci-images
      - run: python scripts/browser_audit_tools.py
      - run: python scripts/capture_research.py --workspace work/ci-research-browser --output work/ci-research-images --audit-tools work/audit-tools
      - run: python scripts/check_evidence.py --verification-record work/ci-evidence/verification.json --browser-record work/ci-images/provenance.json --research-images work/ci-research-images
      - run: python scripts/publication.py --package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: local-verification-${{ matrix.os }}
          path: |
            work/ci-evidence
            work/ci-images
            work/ci-research-images
            dist/*.zip
          if-no-files-found: warn
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build -t gtm-pipeline:test .
      - run: docker run --rm --cap-drop ALL --security-opt no-new-privileges gtm-pipeline:test gtm demo --profile enterprise --workspace .local/container-check
      - run: docker run --rm --cap-drop ALL --security-opt no-new-privileges gtm-pipeline:test gtm demo --profile fixture --workspace .local/container-fixture
      - name: Verify connected evidence ships in the image
        run: >-
          docker run --rm --cap-drop ALL --security-opt no-new-privileges gtm-pipeline:test python -c
          "import json; from pathlib import Path; from gtm.store import digest; p=json.loads(Path('docs/evidence/connected/preview.json').read_text()); n=json.loads(Path('docs/evidence/connected/acceptance.json').read_text()); assert n['status']=='passed' and n['preview_hash']==digest(p) and n['review_hash']==p['review_hash']; assert n['receipt']['exact_content'] and n['receipt']['task_count']==1; print('Recorded connected evidence verified in non-root image; no vendor execution')"
