services:
  workbench:
    build: .
    command: ["gtm", "serve", "--container-bind", "--profile", "enterprise", "--workspace", ".local/enterprise-usd-v2"]
    ports:
      - "127.0.0.1:8560:8560"
    volumes:
      - gtm-demo:/app/.local
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  gtm-demo:
