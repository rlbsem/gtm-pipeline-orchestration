[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-pipeline-orchestration"
version = "1.0.0"
description = "Synthetic SDR pipeline orchestration with governed execution and account experiments"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.12", "httpx==0.28.1", "uvicorn==0.34.2", "pydantic==2.13.5"]

[project.scripts]
gtm = "gtm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gtm = ["*.sql", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
